<script>
  const videos = {
    'video-card1': 'H2NI0dYXuAI',
    'video-card2': 'IQMWyzauaKk',
    'video-card3': 'K342zbjpcUc',
    'video-card4': 'ckutldm1tgc',
    'video-card5': 'R_g4x2HJoyc',
    'video-card6': 'WRk1DW9aBI8',
    'video-card7': '8OVHAQ5oXcQ',
  };

  function buildIframe(videoID, playsinline) {
    const ps = playsinline ? '&playsinline=1' : '';
    return `<iframe width="100%" height="100%"
      src="https://www.youtube.com/embed/${videoID}?autoplay=1${ps}"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen"
      allowfullscreen
      webkit-allowfullscreen
      mozallowfullscreen></iframe>`;
  }

  const modal = document.getElementById('video-modal');
  const modalWrapper = document.getElementById('modal-video-wrapper');
  const modalClose = document.getElementById('modal-close');

  function closeModal() {
    modal.classList.remove('active');
    modalWrapper.innerHTML = '';
  }

  modalClose.addEventListener('click', closeModal);
  modal.addEventListener('click', function(e) {
    if (e.target === modal) closeModal();
  });

  Object.entries(videos).forEach(([id, videoID]) => {
    document.getElementById(id).addEventListener('click', function() {
      if (window.innerWidth <= 768) {
        modalWrapper.innerHTML = buildIframe(videoID, false);
        modal.classList.add('active');
      } else {
        this.innerHTML = buildIframe(videoID, true);
      }
    });
  });
</script>
